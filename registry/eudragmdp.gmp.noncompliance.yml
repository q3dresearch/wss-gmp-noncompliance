source_id: eudragmdp.gmp.noncompliance
status: paused                   # on purpose: driven by examples/capture.py, see notes
cadence: monthly
schema_id: gmpnc.v1

publisher: European Medicines Agency
publisher_tier: first_party
# UNPROVEN, and deliberately flagged. The register carries ELEVEN columns and
# not one of them is a status, so a resolved statement has nowhere to be marked
# resolved -- it must either be edited in place or disappear. Which of those
# happens needs a second capture to answer. The baseline exists (2026-09-22).
destroys_own_history: true
licence: "NOT ESTABLISHED (checked 2026-09-22). eudragmdp.ema.europa.eu serves a genuine 404 for robots.txt, so no crawl rules are stated. EMA's legal notice says the site is subject to 'a disclaimer and copyright and limited reproduction notices' but the reproduction terms themselves were not located. Do not assert a grant."
personal_data: none              # manufacturing sites and companies, not individuals
storage: git

notes: >-
  GMP non-compliance statements issued by EU national inspectorates: which
  pharmaceutical manufacturing sites were found non-compliant, where, and when.
  79 rows on 2026-09-22, up from 78 on 2026-09-15, so the register moves.

  PAUSED MEANS "THE ENGINE DOES NOT DRIVE THIS", NOT "NOTHING CAPTURES IT".
  It is a Struts app needing a four-step handshake: GET the form for a session
  cookie AND an action URL with an embedded jsessionid; POST the search to that
  action URL (btnSearchGMPNC must be the literal string `clicked` -- an empty
  value returns the form and the form page already shows recent statements, so
  it looks like it worked); then read a session-stateful result list. The
  engine carries no cookies between fetches and is not growing a session
  primitive for one source, so `examples/capture.py` does the driving and
  writes through the engine's own storage, gates and manifest code. This entry
  still governs it: licence, gates, schema and personal_data all apply.
  `wss plan` returning [] is the correct answer, which is why the workflow has
  no shard matrix.

  THE EXPORT IS THE REAL SOURCE. `action=ExportList` returns the WHOLE register
  as one .xls, and it is strictly richer than the HTML: 17 columns against 11,
  adding Last Updated Date, DUNS Number, Site NCA Reference and the address
  split into four fields. LAST UPDATED DATE IS THE ONE THAT MATTERS -- this
  register has no status column, so a resolved statement must either be edited
  in place or vanish, and that column is what dates an in-place edit. It is
  populated on all 79 rows with 68 distinct values. The sheet also states
  `Total Records: N`, a count from the publisher rather than one we inferred,
  and capture.py refuses to write if it disagrees with the rows shipped.

  The 8 HTML pages are captured as well, because that is what the shipped
  gmpnc.v1 parser reads and a second representation is worth having when the
  question is what the publisher quietly changed. Verified 2026-09-23: all 71
  report numbers in the export appear across the 8 pages.

  PAGING IS AN ABSOLUTE ZERO-BASED PAGE INDEX, NOT A STEP. `action=Page&param=2`
  is the third page from wherever you are; treating it as "next" refetches the
  same page, which is exactly what happened eight times. The page count comes
  from the export's own record count, not a guess.

  PARSED FROM THE EXPORT ONLY. parsers/gmpnc_v1.py reads the .xls and yields
  nothing for the 8 HTML pages, because parsing both would double every
  statement. `listed` is emitted once per statement per capture and its
  ABSENCE in a later capture is the finding; `last_updated_at` is the
  publisher's own edit stamp and is what makes an in-place edit visible. First
  derive: 713 observations over 79 statements, all 79 keys matching the
  hand-made baseline, last_updated_at spanning 2019-01-28 to 2026-09-21.

  UNIQUE KEY IS (Report Number, EudraGMDP Document Reference Number). Report
  Number alone is NOT unique -- 79 rows carry 71 report numbers because one
  report can name several sites. Diffing on it alone manufactures six permanent
  phantom revisions.

  THE DATE FILTER IS NOT UNDERSTOOD. fromDate=1990-01-01 with toDate=today
  returns the whole register, but narrow ranges return 0. Do not use it to
  partition captures until that is explained.

endpoints:
  - url: "https://eudragmdp.ema.europa.eu/inspections/gmpc/searchGMPNonCompliance.do"
    delay_seconds: 6
    timeout_seconds: 90

gates:
  expect_status: 200
  min_bytes: 8000
  content_type_any: [html]
  must_contain: ["Report Number"]
  must_not_contain: ["Access Denied", "Service Unavailable"]
  max_shrink_pct: 40
